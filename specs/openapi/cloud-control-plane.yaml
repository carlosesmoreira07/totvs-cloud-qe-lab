openapi: 3.1.0
info:
  title: Cloud Control Plane Lab API
  version: 0.1.0
  description: >-
    [LAB] API ficticia e nao oficial para exercicios de Quality Engineering.
    Nao representa contratos, arquitetura ou produtos internos da TOTVS.
servers:
  - url: http://127.0.0.1:4010
    description: Mock local
tags:
  - name: Health
  - name: Instances
  - name: Operations
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Consulta a saude do mock
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Mock disponivel
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/instances:
    post:
      tags: [Instances]
      operationId: createInstance
      summary: Solicita o provisionamento assincrono de uma instancia ficticia
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceRequest'
      responses:
        '202':
          description: Solicitacao aceita ou repeticao idempotente da mesma solicitacao
          headers:
            Location:
              description: URI da operacao assincrona
              schema:
                type: string
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Idempotency-Replayed:
              description: Indica que a resposta reutilizou uma solicitacao anterior
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Chave de idempotencia reutilizada com outro payload
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/instances/{id}:
    get:
      tags: [Instances]
      operationId: getInstance
      summary: Consulta uma instancia ficticia
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Instancia encontrada
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/operations/{id}:
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Consulta o estado de uma operacao assincrona
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Operacao encontrada
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Identificador opcional da cadeia de chamadas; gerado quando ausente
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave que torna repeticoes do mesmo provisionamento idempotentes
      schema:
        type: string
        minLength: 8
        maxLength: 128
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    CorrelationId:
      description: Identificador de correlacao recebido ou gerado pelo servico
      required: true
      schema:
        type: string
    RequestId:
      description: Identificador unico desta requisicao HTTP
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Requisicao invalida
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso inexistente
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version, timestamp]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: cloud-control-plane-mock
        version:
          type: string
          const: 0.1.0
        timestamp:
          type: string
          format: date-time
    CreateInstanceRequest:
      type: object
      additionalProperties: false
      required: [name, region, image, flavor]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9-]{2,39}$'
        region:
          type: string
          minLength: 1
          maxLength: 64
        image:
          type: string
          minLength: 1
          maxLength: 128
        flavor:
          type: string
          minLength: 1
          maxLength: 64
    Instance:
      type: object
      additionalProperties: false
      required: [id, name, region, image, flavor, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        region:
          type: string
        image:
          type: string
        flavor:
          type: string
        status:
          type: string
          enum: [PROVISIONING, RUNNING, ERROR]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Operation:
      type: object
      additionalProperties: false
      required: [id, type, status, resourceId, submittedAt, updatedAt, correlationId]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: PROVISION_INSTANCE
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED]
        resourceId:
          type: string
          format: uuid
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        correlationId:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlationId, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
        requestId:
          type: string
          format: uuid
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, issue]
            properties:
              field:
                type: string
              issue:
                type: string

name: quality-gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Start LAB-05/LAB-06/LAB-07 infrastructure (PostgreSQL + NATS JetStream + Toxiproxy + OTel Collector + Jaeger)
        run: docker compose -f infra/docker-compose.yml up -d --wait
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - run: npm run verify
      - name: Run performance baseline smoke test
        run: npm run test:performance:smoke
      - name: Generate deterministic Executive Quality Scorecard
        if: always()
        run: npm run scorecard
      - name: Teardown LAB-05/LAB-06/LAB-07 infrastructure
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
      - name: Upload deterministic Executive Quality Scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-executive-scorecard
          path: |
            evidence/scorecard/current.json
            evidence/scorecard/executive-summary.md
            evidence/scorecard/executive-scorecard.html
            evidence/scorecard/executive-scorecard.pdf
          if-no-files-found: warn
          retention-days: 14

  ai-advisory-control-results:
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Start LAB-05/LAB-06/LAB-07 infrastructure
        run: docker compose -f infra/docker-compose.yml up -d --wait
      - name: Collect summarized control results
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: evidence/generated/playwright-results.json
        run: |
          mkdir -p evidence/generated
          npm run test:playwright -- --reporter=json
      - name: Teardown LAB-05/LAB-06/LAB-07 infrastructure
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
      - name: Upload control results for the advisory
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qe-ai-control-results
          path: evidence/generated/playwright-results.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload resiliency evidence for failure intelligence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qe-resiliency-evidence
          path: evidence/resiliency/*.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload observability evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qe-observability-evidence
          path: evidence/observability/*.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload synthetic journey evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qe-journey-evidence
          path: evidence/journeys/*.json
          if-no-files-found: warn
          retention-days: 1
      - name: Upload performance evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qe-performance-evidence
          path: evidence/performance/*.json
          if-no-files-found: warn
          retention-days: 1

  ai-quality-advisory:
    if: always() && github.event_name == 'pull_request'
    needs: ai-advisory-control-results
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted analyzer from the PR base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch the untrusted PR diff without executing it
        run: git fetch --no-tags origin pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/qe-ai-pr-head
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Download control results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qe-ai-control-results
          path: evidence/generated
      - name: Generate deterministic minimal context
        env:
          QE_IMPACT_BASE_REF: ${{ github.event.pull_request.base.sha }}
          QE_IMPACT_HEAD_REF: refs/remotes/origin/qe-ai-pr-head
        run: |
          mkdir -p evidence/generated
          npm run --silent impact:context -- --format json > evidence/generated/impact-context.json
      - name: Publish non-blocking AI quality advisory
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QE_AI_MODEL: ${{ vars.QE_AI_MODEL }}
          QE_IMPACT_BASE_REF: ${{ github.event.pull_request.base.sha }}
          QE_IMPACT_HEAD_REF: refs/remotes/origin/qe-ai-pr-head
          QE_IMPACT_CONTEXT_PATH: evidence/generated/impact-context.json
          QE_TEST_RESULTS_PATH: evidence/generated/playwright-results.json
        run: npm run ai:advisory >> "$GITHUB_STEP_SUMMARY"

  ai-executive-scorecard-advisory:
    if: always() && github.event_name == 'pull_request'
    needs: deterministic-quality-gate
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted analyzer from the PR base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Download deterministic scorecard
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qe-executive-scorecard
          path: evidence/scorecard
      - name: Publish non-blocking Executive Quality Scorecard advisory
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QE_AI_MODEL: ${{ vars.QE_AI_MODEL }}
          QE_SCORECARD_PATH: evidence/scorecard/current.json
        run: npm run ai:scorecard >> "$GITHUB_STEP_SUMMARY"

  ai-failure-advisory:
    if: always() && github.event_name == 'pull_request'
    needs: ai-advisory-control-results
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted analyzer from the PR base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch the untrusted PR diff without executing it
        run: git fetch --no-tags origin pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/qe-ai-pr-head
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Download control results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qe-ai-control-results
          path: evidence/generated
      - name: Download resiliency evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qe-resiliency-evidence
          path: evidence/resiliency
      - name: Generate deterministic minimal context
        env:
          QE_IMPACT_BASE_REF: ${{ github.event.pull_request.base.sha }}
          QE_IMPACT_HEAD_REF: refs/remotes/origin/qe-ai-pr-head
        run: |
          mkdir -p evidence/generated
          npm run --silent impact:context -- --format json > evidence/generated/impact-context.json
      - name: Publish non-blocking AI failure intelligence advisory
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QE_AI_MODEL: ${{ vars.QE_AI_MODEL }}
          QE_IMPACT_BASE_REF: ${{ github.event.pull_request.base.sha }}
          QE_IMPACT_HEAD_REF: refs/remotes/origin/qe-ai-pr-head
          QE_IMPACT_CONTEXT_PATH: evidence/generated/impact-context.json
          QE_TEST_RESULTS_PATH: evidence/generated/playwright-results.json
          QE_RESILIENCY_DIR: evidence/resiliency
        run: npm run ai:failure-advisory >> "$GITHUB_STEP_SUMMARY"

  ai-telemetry-advisory:
    if: always() && github.event_name == 'pull_request'
    needs: ai-advisory-control-results
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted analyzer from the PR base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch the untrusted PR diff without executing it
        run: git fetch --no-tags origin pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/qe-ai-pr-head
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Download control results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qe-ai-control-results
          path: evidence/generated
      - name: Download resiliency evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qe-resiliency-evidence
          path: evidence/resiliency
      - name: Download observability evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qe-observability-evidence
          path: evidence/observability
      - name: Generate deterministic minimal context
        env:
          QE_IMPACT_BASE_REF: ${{ github.event.pull_request.base.sha }}
          QE_IMPACT_HEAD_REF: refs/remotes/origin/qe-ai-pr-head
        run: |
          mkdir -p evidence/generated
          npm run --silent impact:context -- --format json > evidence/generated/impact-context.json
      - name: Publish non-blocking AI telemetry intelligence advisory
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QE_AI_MODEL: ${{ vars.QE_AI_MODEL }}
          QE_IMPACT_BASE_REF: ${{ github.event.pull_request.base.sha }}
          QE_IMPACT_HEAD_REF: refs/remotes/origin/qe-ai-pr-head
          QE_IMPACT_CONTEXT_PATH: evidence/generated/impact-context.json
          QE_TEST_RESULTS_PATH: evidence/generated/playwright-results.json
          QE_RESILIENCY_DIR: evidence/resiliency
          QE_OBSERVABILITY_DIR: evidence/observability
        run: npm run ai:telemetry-advisory >> "$GITHUB_STEP_SUMMARY"

  ai-journey-advisory:
    if: always() && github.event_name == 'pull_request'
    needs: ai-advisory-control-results
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted analyzer from the PR base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch the untrusted PR diff without executing it
        run: git fetch --no-tags origin pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/qe-ai-pr-head
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --fund=false
      - name: Download control results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qe-ai-control-results
          path: evidence/generated
      - name: Download resiliency evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qe-resiliency-evidence
          path: evidence/resiliency
      - name: Download observability evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qe-observability-evidence
          path: evidence/observability
      - name: Download synthetic journey evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qe-journey-evidence
          path: evidence/journeys
      - name: Generate deterministic minimal context
        env:
          QE_IMPACT_BASE_REF: ${{ github.event.pull_request.base.sha }}
          QE_IMPACT_HEAD_REF: refs/remotes/origin/qe-ai-pr-head
        run: |
          mkdir -p evidence/generated
          npm run --silent impact:context -- --format json > evidence/generated/impact-context.json
      - name: Publish non-blocking AI journey intelligence advisory
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QE_AI_MODEL: ${{ vars.QE_AI_MODEL }}
          QE_IMPACT_BASE_REF: ${{ github.event.pull_request.base.sha }}
          QE_IMPACT_HEAD_REF: refs/remotes/origin/qe-ai-pr-head
          QE_IMPACT_CONTEXT_PATH: evidence/generated/impact-context.json

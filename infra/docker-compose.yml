# [LAB] Docker Compose para os laboratorios LAB-05, LAB-06 e LAB-07
# PostgreSQL + NATS JetStream + Toxiproxy + OpenTelemetry Collector + Jaeger
# Nao representa a infraestrutura ou topologia interna da TOTVS.

services:
  postgres:
    image: postgres:17-alpine
    container_name: qe-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: control_plane
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control_plane"]
      interval: 2s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: qe-lab-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8222/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 10

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.11.0
    container_name: qe-lab-toxiproxy
    restart: unless-stopped
    command: ["-host=0.0.0.0"]
    ports:
      - "8474:8474"
      - "4223:4223"
    depends_on:
      nats:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: qe-lab-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4319:4317"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:16686/ || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector:0.110.0
    container_name: qe-lab-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      jaeger:
        condition: service_healthy
